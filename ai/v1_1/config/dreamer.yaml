# v1_1 - Dreamer (RSSM-Weltmodell) + Beam-Pfadplaner als Experte.
#
# Unterschiede zu v1_0/config/phase1.yaml, jeweils mit Begruendung:
#
#   n_rays: 36 statt 16    Der Wunsch "alle 10 Grad ein Abstand". 360/36 = 10,
#                          und sensors._ray_units legt die Strahlen exakt auf
#                          2*pi*k/K - Strahl 0 zeigt geradeaus, kopfrelativ.
#                          Kosten: der Beobachtungsvektor waechst von 38 auf 58
#                          Werte, die Strahlensuche von 16 auf 36 Zeilen im
#                          gather. Beides vernachlaessigbar gegenueber dem Bild.
#
#   frame_stack: 1         Der RSSM fuehrt einen rekurrenten Zustand und baut
#                          sich die Historie selbst. Ein 4er-Stack waere
#                          vierfach redundante Information - und im Datensatz
#                          vierfacher Plattenbedarf (siehe data/collect.py).
#
#   obs_resolution: 64     DreamerV3-Standard. Der Decoder muss das Bild
#                          rekonstruieren; bei 96px kostet das ~2.2x mehr
#                          Rechenzeit pro Schritt, ohne dass mehr sichtbar
#                          waere - die relevante Nahfeldgeometrie liefern
#                          ohnehin die 36 Strahlen, nicht das Bild.

version: v1_1
seed: 0

# --------------------------------------------------------------- Simulation
engine_resolution: 256
obs_resolution: 64
frame_stack: 1
max_episode_ticks: 3600

# ----------------------------------------------------------------- Sensoren
n_rays: 36            # alle 10 Grad ein Abstand, kopfrelativ
ray_range_px: 64.0    # ~ ein Wendekreisdurchmesser + Reserve
arc_horizon: 45

# ------------------------------------------------------------------ Gegner
# Fuer die erste Datensammlung bewusst schwach und ohne Items: der Datensatz
# soll zuerst "wie ueberlebe ich ueberhaupt" abdecken, nicht Item-Taktik.
opponents:
  - random
  - rule_based:medium

reward:
  alive_bonus: 0.01
  death_penalty: -1.0
  kill_bonus: 0.5
  win_bonus: 2.0

# ------------------------------------------------------------------ Planer
planner:
  horizon: 60         # 1 Sekunde Vorausschau bei 60 Ticks/s
  commit_ticks: 6     # 10 Bloecke -> Beam statt 3^60 Sequenzen
  beam_width: 12
  clearance_rays: 12
  clearance_range_px: 48.0
  clearance_weight: 0.5
  straight_bonus: 0.05
  epsilon: 0.05       # Streuung, damit der Datensatz auch Fehler enthaelt

# Gemischte Experten-Qualitaeten. Ein einheitlich starker Planer stirbt fast nie
# (<0,3% Todesschritte) - dann lernt der Fortsetzungskopf nur "es geht immer
# weiter" und der Actor hat in der Imagination nichts zu vermeiden. Die
# schwachen Varianten liefern die Aufpralle, die starke das gute Verhalten.
planner_mix:
  - weight: 0.5           # stark: Vorbild fuer die Verhaltensklonung
    horizon: 60
    beam_width: 12
    epsilon: 0.05
  - weight: 0.3           # mittel
    horizon: 30
    beam_width: 6
    epsilon: 0.15
  - weight: 0.2           # schwach: stirbt oft, liefert Todesdaten
    horizon: 15
    beam_width: 3
    epsilon: 0.30

# --------------------------------------------------------------- Datensatz
dataset_dir: null           # null = ai/output/v1_1/dataset
dataset_min_ticks: 200000   # darunter sammelt entry.py automatisch nach
collect_episodes: 100

# ------------------------------------------------- Weltmodell (Patch 2)
# Werte hier schon festgehalten, damit die Konfiguration nicht spaeter
# nachtraeglich erfunden wird. DreamerV3-Groesse "small".
world_model:
  deter_dim: 512        # deterministischer GRU-Zustand h
  stoch_dim: 32         # kategoriale Latents ...
  stoch_classes: 32     # ... 32x32, wie DreamerV3
  hidden_dim: 512
  cnn_depth: 32
  kl_free_nats: 1.0     # free bits, verhindert Posterior-Kollaps
  batch_size: 16
  batch_length: 64      # Sequenzlaenge pro Batch
  continue_pos_weight: 50.0  # Terminals sind <0,3% der Schritte
  terminal_fraction: 0.25    # Anteil der Batch-Sequenzen mit garantiertem Tod
  ttd_cap: 120.0             # Restlebensdauer wird hier gedeckelt
  survival_weight: 1.0
  val_fraction: 0.1          # Split ueber ganze Episoden
  kl_beta_dyn: 0.5      # zieht den Prior zum Posterior (der erwuenschte Weg)
  kl_beta_rep: 0.1      # nur schwach umgekehrt - sonst Posterior-Kollaps
  learning_rate: 1.0e-4
  train_steps: 100000
  grad_clip: 1000.0
  log_every_steps: 200
  dream_every_steps: 2000
  dream_horizon: 32     # so weit wird in der Diagnose blind getraeumt
  cache_episodes: 64    # LRU ueber entpackte Episoden (RAM gegen Ladezeit)

policy:
  imagination_horizon: 15   # 15 getraeumte Ticks pro Startzustand
  gamma: 0.997              # ~330 Ticks Halbwertszeit - passt zu Episoden von 1000+
  lambda_: 0.95
  actor_lr: 3.0e-5
  critic_lr: 3.0e-5
  entropy_scale: 3.0e-4     # hoeher = laenger unentschlossen, niedriger = frueh festgefahren
  slow_critic_decay: 0.98   # EMA-Ziel bricht die Rueckkopplung des Critics auf sich selbst
  hidden_dim: 512
  batch_size: 16
  batch_length: 16
  train_steps: 50000
  log_every_steps: 200
  # Verhaltensklonung auf die Planer-Aktionen VOR der Imagination. Ohne das
  # startet der Actor gleichverteilt, stirbt sofort und lernt aus lauter kurzen,
  # gleich schlechten Traeumen fast nichts.
  bc_steps: 500
  bc_lr: 3.0e-4
  # KL-Anker zur BC-Policy gegen Abdriften in Weltmodell-Luecken. 0 = aus.
  bc_kl_scale: 0.1

# true erzwingt Neutraining des Weltmodells, auch wenn best/world_model.pt existiert
force_world_model: false

# ------------------------------------------------------------ Persistenz
checkpoint_every_steps: 5000
checkpoint_keep: 2
video_every_steps: 25000
video_seconds: 60
