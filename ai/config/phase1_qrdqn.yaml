# Phase 1 - solo survival: avoid the wall, avoid your own trail, live as long as
# possible. No opponents, no items, no win condition (see curve_env.py: episodes
# with zero opponents only end on death/truncation, never on "alive_count<=1").
phase: 1
description: "Solo survival, off-policy (QR-DQN mit Replay-Buffer)."

total_timesteps: 3000000
n_envs: 4   # off-policy braucht keine breiten Rollouts; 4 Sammler genügen
use_subprocess: true
seed: 0

# Algorithmus: ppo (Default) | maskable_ppo | recurrent_ppo | qrdqn
#  - recurrent_ppo: LSTM statt nur 4-Frame-Stack -> echtes Gedächtnis ("wo komme
#    ich her / wo liegt meine Linie"), Hyperparameter siehe phase1_recurrent.yaml
#  - qrdqn: off-policy mit Replay-Buffer -> jeder simulierte Tick wird vielfach
#    wiederverwendet (sample-effizienter auf Colab-Wall-Time), siehe phase1_qrdqn.yaml
#  - Empfohlener Kickstart VOR dem RL-Training (überspringt die Zufalls-Crash-Phase):
#      python -m ai.training.bc_pretrain --config ai/config/phase1.yaml --out ai/runs/bc/bc_phase1.zip
#      python -m ai.training.train --config ai/config/phase1.yaml --init-from ai/runs/bc/bc_phase1.zip
algo: qrdqn

engine_resolution: 256
# obs_resolution ist der CNN-Input, NICHT die Physik (die läuft immer auf
# engine_resolution). 96 -> 256 ("volle Auflösung") würde ~7x mehr Pixel durch
# CNN und VRAM schieben - pro Schritt UND pro Batch - für Detailschärfe, die die
# Sensor-Features unten (Rays + Arc-Überlebenszeiten) dem Netz bereits exakt und
# billig liefern. Der Regler existiert bewusst: wer es testen will, setzt hier
# 128/192/256 und cnn_arch: medium - Checkpoints sind dann inkompatibel (neuer Run).
obs_resolution: 96
frame_stack: 4
max_episode_ticks: 3600

# lookahead sensors appended to the vector observation (ai/env/sensors.py):
# 16 heading-relative lidar distances + 3 "survival ticks if I hold LEFT /
# STRAIGHT / RIGHT" times. The 96px CNN image keeps the global layout, but a 2px
# trail downsamples to a ~1px line at 30-75% brightness and the head dot is
# sub-pixel - near-head geometry ("my own line is RIGHT THERE") is exactly what
# these sensors provide directly. ray_range 64px = ~1 turning circle diameter +
# margin; arc_horizon 45 ticks = ~1.5x the ticks of a quarter turn.
n_rays: 16
ray_range_px: 64.0
arc_horizon: 45

use_action_masking: false
action_mask_horizon: 3
cnn_arch: small

ppo:
  gamma: 0.99   # von qrdqn übernommen; MUSS zu reward.shaping_gamma passen

# QR-DQN-Hyperparameter. WICHTIG: buffer_size ist ein RAM-Regler - der Buffer
# hält obs UND next_obs als rohe uint8-Frame-Stacks (12x96x96 = ~110 KB, also
# ~221 KB je Transition). 20000 ~= 4.4 GB. build_algo_kwargs druckt die
# Schätzung beim Start. Exploration läuft über epsilon-greedy statt Entropie.
qrdqn:
  learning_rate: 0.0001
  buffer_size: 20000
  learning_starts: 5000
  batch_size: 64
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 2000
  exploration_fraction: 0.2
  exploration_final_eps: 0.05

reward:
  alive_bonus: 0.01
  death_penalty: -1.0
  kill_bonus: 0.0
  win_bonus: 0.0
  placement_scale: 0.0
  # ONE potential-based clearance term replaces "stay centered" / "steer away from
  # wall" / "steer away from own trail" / "drive parallel" event bonuses: those are
  # farmable (approach + turn away = free reward loop) and pull in opposite
  # directions; a potential over distance-to-nearest-obstacle rewards exactly the
  # same instincts without changing the optimal policy (see RewardConfig).
  clearance_weight: 0.05
  clearance_range_px: 40.0
  clearance_rays: 8
  shaping_gamma: 0.99   # keep equal to ppo.gamma
  # end the episode the moment the border is provably unescapable (turning-radius
  # geometry) - moves the death penalty onto the decision that caused it
  terminate_doomed_border: true
  # second potential (same PBRS math as clearance): phi = best escape time over
  # hold-L/S/R arcs / arc_horizon. Pays continuously for keeping escape options
  # open = punishes flying toward certain death LONG before impact. This is the
  # anticipatory ("wenn ich bis dahin nicht lenke, sterbe ich") training signal.
  horizon_weight: 0.08
  # ...and when ALL THREE strategies die within doom_horizon ticks, end the
  # episode right there with the death penalty. Covers the dominant Phase-1
  # failure (spiraling into the own trail), which terminate_doomed_border cannot
  # see. Keep OFF in item phases - b_clear/g_ghost/b_sides pickups can rescue a
  # doomed state.
  terminate_doomed_any: true
  doom_horizon: 12

curriculum:
  blend_window_episodes: 50
  rolling_window: 200
  pool_variants: 4
  stages:
    - name: solo
      n_opponents: 0
      opponent_mix: []
      items_enabled: false
      win_rate_threshold: 1.1
      min_episodes: 999999999

enable_league: false
enable_self_play_snapshots: false

# rotating resumable checkpoints (only the newest survives; --resume auto continues)
checkpoint_every_steps: 100000
checkpoint_keep: 1
# one deterministic behavior video per interval, written headlessly as MP4 into
# <run>/videos/ (on Drive when --run-root points there); 0 disables.
# video_seconds == max_episode_ticks/60: das Video deckt die GANZE Episode ab,
# inkl. Tod bzw. Episoden-Limit. (Vorher 30s: beide 30.5s-Videos bei 2.5M/3M
# waren exakt 1831 Frames = 1+1800+30 - der Agent lebte noch, nur die Aufnahme
# war zu Ende. Die neue Endkarte im Video benennt den Ende-Grund jetzt explizit.)
video_every_steps: 500000
video_seconds: 60
# Videos werden VEKTORIELL in video_render_scale x engine_resolution neu gezeichnet
# (3 -> 768px, glatte Linien statt 2x2-Klötzchen; intern 2x supersampled).
# 0 = alter Pfad (Engine-Raster, Nearest-Neighbor hochskaliert).
video_render_scale: 3

# bestes Modell des Laufs (zusätzlich zu den rotierenden Checkpoints, die immer
# nur den NEUESTEN Stand halten): gleitender Mittelwert über best_window_episodes
# Episoden; bei neuem Bestwert wird <run>/best/best_model.zip atomar ersetzt.
# In Phase 1 ist die Überlebenszeit (ep_len_mean) die ehrlichste Metrik - der
# Reward enthält Shaping-Terme. best_history.csv protokolliert jede Verbesserung.
best_metric: ep_len_mean
best_window_episodes: 100
best_min_episodes: 50
best_check_every_steps: 10000

# Messpunkt-Dichte der metrics.csv (vorher fest 2000): 1 Zeile je 500 Schritte
# ->  bei 3M Schritten ~6000 Messpunkte, damit die neuen "mean_"-Charts
# (gleitendes Mittel über 1.000/10.000 Messpunkte) wirklich glätten statt fast
# den Globalmittelwert zu zeigen. Bei --resume harmlos: alte Zeilen behalten
# ihren 2000er-Abstand, neue kommen dichter - die Charts tragen ohnehin Schritte
# auf der x-Achse.
metrics_log_every_steps: 500
